{% extends "myauth/base.html" %}

{% block title %}Список пользователей{% endblock %}

{% block body %}
  <h1>Пользователи</h1>

  <table>
    <thead>
      <tr>
        <th>Username</th>
        <th>Фамилия</th>
        <th>Имя</th>
        <th>Статус</th>
      </tr>
    </thead>
    <tbody>
      {% for u in users %}
        <tr>
          <td>
            <a href="{% url 'myauth:user-detail' u.pk %}">{{ u.username }}</a>
          </td>
          <td>{{ u.last_name }}</td>
          <td>{{ u.first_name }}</td>
          <td>
            {% if u.is_staff %}Staff{% else %}User{% endif %}
          </td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
{% endblock %}
