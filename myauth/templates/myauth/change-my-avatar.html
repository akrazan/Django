{% extends "myauth/base.html" %}

{% block title %}Сменить аватар{% endblock %}

{% block body %}
<h1>Сменить аватар</h1>

<div>
  {% if object.avatar %}
    <img src="{{ object.avatar.url }}" alt="Текущий аватар" style="max-width: 200px; border-radius: 8px;">
    <p>Текущий файл: {{ object.avatar.name }}</p>
  {% else %}
    <div style="width:200px; height:200px; background:#eee; display:flex; align-items:center; justify-content:center; border-radius:8px;">Нет аватара</div>
  {% endif %}
</div>

<form method="post" enctype="multipart/form-data">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Загрузить новый аватар</button>
</form>

<p><a href="{% url 'myauth:about-me' %}" class="text-muted">Вернуться к профилю</a></p>
{% endblock %}
