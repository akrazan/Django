<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Мой сайт{% endblock %}</title>
</head>
<body>
    <header>
        <h1>Супермаркет «Пуля»</h1>
        <nav>
            <a href="{% url 'shopapp:index' %}">Главная</a> |
            <a href="{% url 'shopapp:product_list' %}">Каталог товаров</a> |
            <a href="{% url 'shopapp:order_list' %}">Реестр заказов</a> |
            <a href="{% url 'myauth:user-list' %}">Пользователи</a>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <br>
        <p>&copy; {% now "Y" %} - супермаркет «Пуля»</p>
    </footer>
</body>
</html>
